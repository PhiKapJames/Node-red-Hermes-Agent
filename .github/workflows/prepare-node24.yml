name: Prepare Node 24 metadata
on:
  push:
    branches: [feat/node24-modernization]
    paths: ['.migration/**', '.github/workflows/prepare-node24.yml']
permissions:
  contents: write
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node .migration/finalize.cjs
      - name: Commit deterministic metadata updates only
        run: |
          git diff --check
          git add package-lock.json nodes/hermes.html scripts/lint.cjs README.md CHANGELOG.md
          git rm -r .migration
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: align Node 24 metadata, help and development instructions'
          git push origin HEAD:feat/node24-modernization
