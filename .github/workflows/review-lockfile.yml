name: Prepare review tooling
on:
  push:
    branches: [chore/review-tooling-lockfile]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export baseline review fixtures
        shell: bash
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const zlib = require('node:zlib');
          const { execFileSync } = require('node:child_process');
          const files = execFileSync('git', ['ls-files'], { encoding: 'utf8' }).trim().split('\n');
          const groups = {
            TESTS: files.filter(f => f.startsWith('test/')),
            DOCS: files.filter(f => !f.startsWith('test/') && !f.startsWith('lib/') && f !== 'nodes/hermes.js' && f !== '.github/workflows/review-lockfile.yml')
          };
          for (const [name, paths] of Object.entries(groups)) {
            const values = Object.fromEntries(paths.map(path => [path, fs.readFileSync(path, 'utf8')]));
            console.log(name + '_GZIP_BASE64=' + zlib.gzipSync(JSON.stringify(values)).toString('base64'));
          }
          JS
      - name: Generate exact dev-tool lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --save-dev --save-exact eslint@9.39.1 @eslint/js@9.39.1 globals@16.5.0
      - name: Export lockfile
        run: |
          node -e "const fs=require('node:fs'),z=require('node:zlib'); console.log('LOCK_GZIP_BASE64='+z.gzipSync(fs.readFileSync('package-lock.json')).toString('base64'))"
