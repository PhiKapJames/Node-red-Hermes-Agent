name: Validate review fixes
on:
  push:
    branches: [chore/review-tooling-lockfile]
    paths: ['.review/**', '.github/workflows/review-lockfile.yml', 'test/review.test.js', 'test/integration/review.test.js', 'scripts/lint.cjs', 'eslint.config.cjs']
permissions:
  contents: write
concurrency:
  group: hermes-review-workbench
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply agreed review changes
        run: |
          python3 .review/apply.py
          node <<'JS'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.devDependencies = { '@eslint/js': '10.0.1', eslint: '10.12.0', globals: '16.5.0' };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          const readme = fs.readFileSync('README.md', 'utf8');
          fs.writeFileSync('README.md', readme.replace('## Develop and test\n', '## Develop and test\n\nDevelopment checks use ESLint 10 and require Node.js 22.13+ or Node.js 24+. The installed package has no runtime lint dependency.\n'));
          JS
      - name: Generate exact development-tool lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Install Node-RED test runtime
        run: npm install --no-save --package-lock=false node-red@4 node-red-node-test-helper
      - run: node --test test/integration/*.test.js
      - run: npm pack
      - name: Save validated product changes (workflow updates are handled separately)
        shell: bash
        run: |
          git diff --check
          git restore --source=HEAD -- .github/workflows/test.yml
          git add -- nodes lib test docs scripts package.json package-lock.json README.md CHANGELOG.md eslint.config.cjs examples
          git rm -r -- .review
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: apply and validate agreed code review corrections'
          git push origin HEAD:chore/review-tooling-lockfile
          echo "VALIDATED_COMMIT=$(git rev-parse HEAD)"
          echo "VALIDATED_TREE=$(git rev-parse 'HEAD^{tree}')"
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-hermes-package
          path: '*.tgz'
          if-no-files-found: error
