name: Test and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Node ${{ matrix.node }} / Node-RED 5
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['24.0.0', '24', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
        env:
          NODE_OPTIONS: --throw-deprecation
      - name: Install real Node-RED 5 without the deprecated test helper
        run: npm install --no-save --package-lock=false --ignore-scripts node-red@5
      - name: Verify removed test dependencies stay absent
        run: |
          node - <<'JS'
          for (const name of ['node-red-node-test-helper', 'sinon', 'lodash.get', '@sinonjs/text-encoding']) {
            try { require.resolve(name); throw new Error('Removed test dependency returned: ' + name); }
            catch (error) { if (error.code !== 'MODULE_NOT_FOUND') throw error; }
          }
          console.log('Real Node-RED:', require('node-red/package.json').version);
          JS
      - name: Test actual Node-RED processes against mock Hermes
        run: npm run test:integration
        env:
          NODE_OPTIONS: --throw-deprecation
      - run: npm pack
        if: matrix.node == '24'
      - uses: actions/upload-artifact@v7
        if: matrix.node == '24'
        with:
          name: hermes-node24-package
          path: '*.tgz'
          if-no-files-found: error
