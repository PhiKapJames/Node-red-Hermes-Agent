name: Test and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Install Node-RED 5 integration-test dependencies
        run: npm install --no-save --package-lock=false node-red@5 node-red-node-test-helper
      - name: Test Node-RED 5 runtime against mock Hermes server
        run: node --test test/integration/*.test.js
      - run: npm pack
        if: matrix.node == 24
      - uses: actions/upload-artifact@v7
        if: matrix.node == 24
        with:
          name: hermes-node-red-5-package
          path: '*.tgz'
          if-no-files-found: error
